<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grid World</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Grid World</h1>
    <p>選擇網格大小: <select id="gridSize">
        <option value="5">5x5</option>
        <option value="6">6x6</option>
        <option value="7">7x7</option>
        <option value="8">8x8</option>
        <option value="9">9x9</option>
    </select> | gamma: <input type="number" id="gamma" value="0.9" step="0.1" min="0" max="1"> | 終點獎勵: <input type="number" id="goalReward" value="10" step="1" min="0"></p>
    <p>左鍵設置起點（綠色）、終點（紅色）、障礙物（黑色）。右鍵清除。雙擊設置終點。</p>
    <div id="grid"></div>
    <button id="compute">價值迭代</button>
    <button id="randomPolicy">隨機策略</button>
    <div id="message"></div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
